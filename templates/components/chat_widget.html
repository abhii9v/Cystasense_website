<style>
.chat-widget-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6610f2 0%, #14b8a6 100%);
    border: none;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(102, 16, 242, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 1000;
}

.chat-widget-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 28px rgba(102, 16, 242, 0.5);
}

.chat-widget-btn .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #dc3545;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 10px;
}

.chat-widget-popup {
    position: fixed;
    bottom: 100px;
    right: 24px;
    width: 380px;
    max-width: calc(100vw - 48px);
    height: 520px;
    max-height: calc(100vh - 150px);
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1001;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.chat-widget-popup.show {
    display: flex;
}

.widget-header {
    background: linear-gradient(135deg, #6610f2 0%, #14b8a6 100%);
    color: white;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.widget-header .avatar {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.widget-header h5 {
    margin: 0;
    font-weight: 600;
}

.widget-header p {
    margin: 0;
    font-size: 0.8rem;
    opacity: 0.9;
}

.widget-close {
    margin-left: auto;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    padding: 8px;
    opacity: 0.8;
    transition: opacity 0.2s;
}

.widget-close:hover {
    opacity: 1;
}

.widget-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f8f9fa;
}

.widget-message {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.9rem;
    line-height: 1.4;
}

.widget-message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #6610f2, #7c3aed);
    color: white;
    border-bottom-right-radius: 4px;
}

.widget-message.assistant {
    align-self: flex-start;
    background: white;
    color: #333;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.widget-welcome {
    text-align: center;
    padding: 20px 10px;
}

.widget-welcome h6 {
    color: #6610f2;
    margin-bottom: 8px;
}

.widget-welcome p {
    color: #666;
    font-size: 0.85rem;
    margin-bottom: 16px;
}

.widget-suggestions {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.widget-suggestion {
    background: white;
    border: 1px solid #e9ecef;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
}

.widget-suggestion:hover {
    border-color: #6610f2;
    background: #f8f5ff;
}

.widget-input-area {
    padding: 12px;
    background: white;
    border-top: 1px solid #e9ecef;
    display: flex;
    gap: 10px;
}

.widget-input {
    flex: 1;
    border: 1px solid #e9ecef;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 0.9rem;
    outline: none;
}

.widget-input:focus {
    border-color: #6610f2;
}

.widget-send {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6610f2, #14b8a6);
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.widget-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.widget-typing {
    display: flex;
    gap: 4px;
    padding: 8px 14px;
    background: white;
    border-radius: 14px;
    align-self: flex-start;
}

.widget-typing span {
    width: 6px;
    height: 6px;
    background: #6610f2;
    border-radius: 50%;
    animation: widgetTyping 1.4s infinite;
}

.widget-typing span:nth-child(2) { animation-delay: 0.2s; }
.widget-typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes widgetTyping {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-3px); opacity: 1; }
}

.widget-expand-link {
    text-align: center;
    padding: 8px;
    background: #f0f0f0;
    border-top: 1px solid #e9ecef;
}

.widget-expand-link a {
    color: #6610f2;
    font-size: 0.8rem;
    text-decoration: none;
}

.widget-expand-link a:hover {
    text-decoration: underline;
}
</style>

<button class="chat-widget-btn" id="chatWidgetBtn" onclick="toggleChatWidget()">
    <i class="bi bi-chat-dots-fill"></i>
</button>

<div class="chat-widget-popup" id="chatWidgetPopup">
    <div class="widget-header">
        <div class="avatar">
            <i class="bi bi-robot"></i>
        </div>
        <div>
            <h5>PCOS Assistant</h5>
            <p>Ask me anything</p>
        </div>
        <button class="widget-close" onclick="toggleChatWidget()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    
    <div class="widget-messages" id="widgetMessages">
        <div class="widget-welcome" id="widgetWelcome">
            <h6>Hi! How can I help?</h6>
            <p>I can answer questions about PCOS based on trusted medical sources.</p>
            <div class="widget-suggestions">
                <button class="widget-suggestion" onclick="widgetSendSuggestion('What is PCOS?')">
                    What is PCOS?
                </button>
                <button class="widget-suggestion" onclick="widgetSendSuggestion('What are PCOS symptoms?')">
                    What are PCOS symptoms?
                </button>
                <button class="widget-suggestion" onclick="widgetSendSuggestion('Best diet for PCOS?')">
                    Best diet for PCOS?
                </button>
            </div>
        </div>
    </div>
    
    <div class="widget-expand-link">
        <a href="/health-assistant" id="widgetFullChatLink"><i class="bi bi-arrows-fullscreen"></i> Open Full Chat</a>
    </div>
    
    <div class="widget-input-area">
        <input type="text" 
               class="widget-input" 
               id="widgetInput" 
               placeholder="Ask a question..." 
               onkeypress="widgetHandleKeyPress(event)">
        <button class="widget-send" id="widgetSendBtn" onclick="widgetSendMessage()">
            <i class="bi bi-send-fill"></i>
        </button>
    </div>
</div>

<script>
let widgetConversationId = null;
let widgetIsWaiting = false;

function updateFullChatLink() {
    const link = document.getElementById('widgetFullChatLink');
    if (widgetConversationId) {
        link.href = '/health-assistant?conversation_id=' + encodeURIComponent(widgetConversationId);
    } else {
        link.href = '/health-assistant';
    }
}

function toggleChatWidget() {
    const popup = document.getElementById('chatWidgetPopup');
    popup.classList.toggle('show');
    if (popup.classList.contains('show')) {
        document.getElementById('widgetInput').focus();
    }
}

function widgetSendSuggestion(text) {
    document.getElementById('widgetInput').value = text;
    widgetSendMessage();
}

function widgetHandleKeyPress(event) {
    if (event.key === 'Enter' && !widgetIsWaiting) {
        widgetSendMessage();
    }
}

function widgetSendMessage() {
    const input = document.getElementById('widgetInput');
    const message = input.value.trim();
    
    if (!message || widgetIsWaiting) return;
    
    document.getElementById('widgetWelcome')?.remove();
    
    widgetAddMessage(message, 'user');
    input.value = '';
    
    widgetShowTyping();
    widgetIsWaiting = true;
    document.getElementById('widgetSendBtn').disabled = true;
    
    fetch('/api/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
        },
        body: JSON.stringify({
            message: message,
            conversation_id: widgetConversationId
        })
    })
    .then(response => response.json())
    .then(data => {
        widgetHideTyping();
        widgetIsWaiting = false;
        document.getElementById('widgetSendBtn').disabled = false;
        
        if (data.response) {
            widgetConversationId = data.conversation_id;
            updateFullChatLink();
            widgetAddMessage(data.response, 'assistant');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        widgetHideTyping();
        widgetIsWaiting = false;
        document.getElementById('widgetSendBtn').disabled = false;
        widgetAddMessage('Sorry, please try again.', 'assistant');
    });
}

function widgetFormatMarkdown(text) {
    return text
        .replace(/^### (.*?)$/gm, '<strong>$1</strong><br>')
        .replace(/^## (.*?)$/gm, '<strong>$1</strong><br>')
        .replace(/^# (.*?)$/gm, '<strong>$1</strong><br>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^- (.*?)$/gm, '• $1')
        .replace(/^\* (.*?)$/gm, '• $1')
        .replace(/^\d+\. (.*?)$/gm, '• $1')
        .replace(/\n/g, '<br>');
}

function widgetAddMessage(text, type) {
    const container = document.getElementById('widgetMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `widget-message ${type}`;
    
    let formattedText = widgetFormatMarkdown(text);
    
    if (formattedText.length > 500) {
        formattedText = formattedText.substring(0, 500) + '... <a href="/health-assistant" style="color: inherit; text-decoration: underline;">Read more</a>';
    }
    
    messageDiv.innerHTML = formattedText;
    container.appendChild(messageDiv);
    
    // Scroll to show the beginning of the new message
    messageDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function widgetShowTyping() {
    const container = document.getElementById('widgetMessages');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'widget-typing';
    typingDiv.id = 'widgetTyping';
    typingDiv.innerHTML = '<span></span><span></span><span></span>';
    container.appendChild(typingDiv);
    typingDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function widgetHideTyping() {
    document.getElementById('widgetTyping')?.remove();
}
</script>
